plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.subtitleplayer'
    compileSdk 34

    // 稳定签名：使用 CI 上恢复的固定 debug keystore（~/.android/debug.keystore）。
    // 显式指定可确保每次构建签名一致，覆盖安装不丢数据。
    signingConfigs {
        stable {
            storeFile file(System.getProperty('user.home') + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    defaultConfig {
        applicationId "com.example.subtitleplayer"
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "1.13"
    }

    buildTypes {
        debug {
            if (file(System.getProperty('user.home') + "/.android/debug.keystore").exists()) {
                signingConfig signingConfigs.stable
            }
        }
        release {
            if (file(System.getProperty('user.home') + "/.android/debug.keystore").exists()) {
                signingConfig signingConfigs.stable
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.subtitleplayer'
    compileSdk 36

    // 稳定签名：使用 CI 上恢复的固定 debug keystore（~/.android/debug.keystore）。
    // 显式指定可确保每次构建签名一致，覆盖安装不丢数据。
    signingConfigs {
        stable {
            storeFile file(System.getProperty('user.home') + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    defaultConfig {
        applicationId "com.example.subtitleplayer"
        minSdk 26
        targetSdk 34
        versionCode 22
        versionName "1.33.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            if (file(System.getProperty('user.home') + "/.android/debug.keystore").exists()) {
                signingConfig signingConfigs.stable
            }
        }
        release {
            if (file(System.getProperty('user.home') + "/.android/debug.keystore").exists()) {
                signingConfig signingConfigs.stable
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            // Robolectric 需要：让 JVM 单元测试能用 Android 资源/框架桩
            includeAndroidResources = true
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // ExoPlayer（Media3）兜底播放引擎：个别 Android 16 机型 MediaPlayer 出声即报
    // -19(ENODEV)（实测 vivo V2324HA），自动切 ExoPlayer 可正常播放；正常机型不触发
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-common:1.5.1'
    // 词幕（LyricOn）状态栏歌词 Provider SDK（Apache-2.0）
    implementation 'io.github.proify.lyricon:provider:0.1.70'

    // 单元测试（GitHub Actions 云端跑：gradle testDebugUnitTest）
    testImplementation 'junit:junit:4.13.2'
    // Robolectric：JVM 里模拟 Android 框架（Uri/ContentResolver 等），测 findLyric/ID3 解析
    testImplementation 'org.robolectric:robolectric:4.11.1'

    // 仪器化 UI 测试（GitHub Actions 模拟器跑：connectedDebugAndroidTest）
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    // UiAutomator：跨窗口查对话框内容，不依赖窗口焦点（headless 模拟器上 Espresso onView 会因无焦点超时）
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.2.0'
}

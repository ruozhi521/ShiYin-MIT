plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// sherpa-onnx 经 JitPack 分发：仓库直接声明在本文件，避免仅改 settings.gradle 时上传遗漏
repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

android {
    namespace 'com.example.subtitleplayer'
    compileSdk 36

    // 稳定签名：使用 CI 上恢复的固定 debug keystore（~/.android/debug.keystore）。
    // 显式指定可确保每次构建签名一致，覆盖安装不丢数据。
    signingConfigs {
        stable {
            storeFile file(System.getProperty('user.home') + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    defaultConfig {
        applicationId "com.example.subtitleplayer"
        minSdk 26
        targetSdk 34
        versionCode 35
        versionName "3.0.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // ⚠️ 3.1 离线翻译用：onnxruntime-android 与 sherpa-onnx 都打包
    //    lib/<abi>/libonnxruntime.so（同名、内容不同），不处理会构建失败：
    //      > 2 files found with path 'lib/arm64-v8a/libonnxruntime.so'
    //    这个名字是 ELF DT_SONAME 里硬编码的，**不能改名**（改了 dlopen 找不到 → 启动即崩），
    //    也不能靠改 Maven 坐标绕开（冲突发生在打包之后，不在依赖解析阶段）。
    //    只能让 APK 里保留一份。实测两侧 JNI 都只用 ORT 的 C API（唯一入口 OrtGetApiBase，
    //    无 C++ mangled 符号），且 ORT 官方承诺 C API ABI 跨版本稳定；
    //    sherpa 内置 ORT 为 1.27.1，onnxruntime-android 取同代的 1.27.0，
    //    故任一份都能同时满足两侧的符号需求（仍须真机实测确认）。
    packagingOptions {
        pickFirst 'lib/arm64-v8a/libonnxruntime.so'
        pickFirst 'lib/armeabi-v7a/libonnxruntime.so'
        pickFirst 'lib/x86/libonnxruntime.so'
        pickFirst 'lib/x86_64/libonnxruntime.so'
    }

    buildTypes {
        debug {
            if (file(System.getProperty('user.home') + "/.android/debug.keystore").exists()) {
                signingConfig signingConfigs.stable
            }
        }
        release {
            if (file(System.getProperty('user.home') + "/.android/debug.keystore").exists()) {
                signingConfig signingConfigs.stable
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            // Robolectric 需要：让 JVM 单元测试能用 Android 资源/框架桩
            includeAndroidResources = true
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

// 离线翻译（3.1）：把 libonnxruntime4j_jni.so 的符号版本需求对齐到 sherpa 提供的
// VERS_1.27.1（否则真机 UnsatisfiedLinkError: cannot locate symbol "OrtGetApiBase"）。
// 详细背景见该文件头部注释。
apply from: 'ort-patch.gradle'

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // ExoPlayer（Media3）兜底播放引擎：个别 Android 16 机型 MediaPlayer 出声即报
    // -19(ENODEV)（实测 vivo V2324HA），自动切 ExoPlayer 可正常播放；正常机型不触发
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-common:1.5.1'
    // 词幕（LyricOn）状态栏歌词 Provider SDK（Apache-2.0）
    implementation 'io.github.proify.lyricon:provider:0.1.70'

    // 歌词识别（1.33.1 实验）：sherpa-onnx JNI（Apache-2.0），JitPack 预编译 AAR
    implementation 'com.github.k2-fsa.sherpa-onnx:sherpa-onnx:v1.13.5'

    // 离线翻译（3.1）：ONNX Runtime Java API（MIT）。
    // 版本取 1.27.0 —— 与 sherpa 内置的 ORT 1.27.1 同代，配合上面的 pickFirst 更稳。
    // 只用于跑 MarianMT（encoder/decoder 两个 onnx），不参与 ASR。
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.27.0'

    // 单元测试（GitHub Actions 云端跑：gradle testDebugUnitTest）
    testImplementation 'junit:junit:4.13.2'
    // Robolectric：JVM 里模拟 Android 框架（Uri/ContentResolver 等），测 findLyric/ID3 解析
    testImplementation 'org.robolectric:robolectric:4.11.1'

    // 仪器化 UI 测试（GitHub Actions 模拟器跑：connectedDebugAndroidTest）
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    // UiAutomator：跨窗口查对话框内容，不依赖窗口焦点（headless 模拟器上 Espresso onView 会因无焦点超时）
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.2.0'
}
